<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Anjaneya Gym</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header class="navbar">

    <a href="index.html"
       class="logo">

        ANJANEYA GYM

    </a>


    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="membership.html">
            Membership
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<main class="auth-page">


    <div class="auth-container">


        <div class="auth-card register-card">


            <div class="auth-header">

                <div class="auth-icon">
                    💪
                </div>


                <h1>
                    Join Anjaneya Gym
                </h1>


                <p>
                    Create your account and start your fitness journey
                </p>

            </div>



            <!-- REGISTRATION FORM -->

            <form id="registerForm">


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>



                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="Enter 10-digit phone number"
                            pattern="[0-9]{10}"
                            required>

                    </div>



                    <div class="form-group">

                        <label>
                            Gmail Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your Gmail"
                            required>

                    </div>



                    <div class="form-group">

                        <label>
                            Gym App Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create your gym password"
                            minlength="6"
                            required>

                    </div>



                    <div class="form-group">

                        <label>
                            Membership Plan
                        </label>

                        <select
                            id="membershipPlan"
                            class="form-control"
                            required>

                            <option value="">
                                Select Plan
                            </option>

                            <option value="Strength Monthly">
                                Strength - ₹800 / Month
                            </option>

                            <option value="Strength 3 Months">
                                Strength - ₹1850 / 3 Months
                            </option>

                            <option value="Strength 6 Months">
                                Strength - ₹4000 / 6 Months
                            </option>

                            <option value="Cardio Monthly">
                                Cardio - ₹1000 / Month
                            </option>

                            <option value="Cardio 3 Months">
                                Cardio - ₹2600 / 3 Months
                            </option>

                            <option value="Cardio 6 Months">
                                Cardio - ₹5000 / 6 Months
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label>
                            Preferred Gym Timing
                        </label>

                        <select
                            id="preferredTiming"
                            class="form-control"
                            required>

                            <option value="">
                                Select Timing
                            </option>

                            <option value="Morning">
                                🌅 Morning
                            </option>

                            <option value="Evening">
                                🌆 Evening
                            </option>

                        </select>

                    </div>


                </div>



                <button
                    type="submit"
                    class="btn btn-primary auth-button">

                    CREATE GYM ACCOUNT

                </button>


            </form>



            <!-- OTP SECTION -->

            <div id="otpSection"
                 style="display:none; margin-top:25px;">


                <h3>
                    Verify Your Gmail
                </h3>


                <p id="otpInfo">
                    OTP has been sent to your Gmail.
                </p>


                <input
                    type="text"
                    id="otp"
                    class="form-control"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6">


                <button
                    type="button"
                    id="verifyButton"
                    class="btn btn-primary auth-button"
                    style="margin-top:15px;">

                    VERIFY EMAIL

                </button>


            </div>



            <p id="message"
               style="margin-top:20px;">
            </p>



            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


        </div>

    </div>

</main>



<script>

let registeredEmail = "";



document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim().toLowerCase();

        const password =
            document.getElementById("password").value;

        const membershipPlan =
            document.getElementById("membershipPlan").value;

        const preferredTiming =
            document.getElementById("preferredTiming").value;


        const message =
            document.getElementById("message");


        message.innerText =
            "Creating your account...";


        try {

            const response =
                await fetch(
                    "/api/members/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            phone: phone,

                            email: email,

                            password: password,

                            membershipPlan:
                                membershipPlan,

                            preferredTiming:
                                preferredTiming

                        })
                    }
                );


            const result =
                await response.text();


            if (result ===
                "EMAIL_ALREADY_REGISTERED") {


                message.innerText =
                    "This Gmail is already registered. Please login instead.";


                message.style.color =
                    "#ff4444";


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 2000);


                return;
            }



            if (result === "OTP_SENT") {

                registeredEmail = email;


                document
                    .getElementById("otpSection")
                    .style.display = "block";


                document
                    .getElementById("registerForm")
                    .style.display = "none";


                message.innerText =
                    "OTP sent successfully to your Gmail.";


                message.style.color =
                    "#00ff88";


                document
                    .getElementById("otpInfo")
                    .innerText =
                    "Enter the OTP sent to " + email;

            }


        } catch (error) {

            message.innerText =
                "Something went wrong. Please try again.";

            message.style.color =
                "#ff4444";

        }

    });



document
    .getElementById("verifyButton")
    .addEventListener("click", async function() {


        const otp =
            document
                .getElementById("otp")
                .value.trim();


        const message =
            document
                .getElementById("message");


        if (otp.length !== 6) {

            message.innerText =
                "Please enter a valid 6-digit OTP.";

            message.style.color =
                "#ff4444";

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/members/verify?email="
                    + encodeURIComponent(registeredEmail)
                    + "&otp="
                    + encodeURIComponent(otp),

                    {
                        method: "POST"
                    }
                );


            const result =
                await response.text();


            if (result ===
                "EMAIL_VERIFIED") {


                message.innerText =
                    "Email verified successfully! Opening your gym dashboard...";


                message.style.color =
                    "#00ff88";


                // Save logged-in email
                localStorage.setItem(
                    "gymEmail",
                    registeredEmail
                );


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 1200);


            } else {

                message.innerText =
                    "Invalid or expired OTP.";

                message.style.color =
                    "#ff4444";
            }


        } catch (error) {

            message.innerText =
                "Verification failed. Please try again.";

            message.style.color =
                "#ff4444";

        }

    });

</script>


</body>

</html>
